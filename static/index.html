<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Agent</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Deep Research</h2>
                <button id="new-chat-btn" class="primary-btn">+ New Chat</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- Session history items injected here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-header">
                <span id="current-session-id">Session: Auto</span>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Welcome Message -->
                <div class="message assistant">
                    <div class="message-content">
                        Hi, I'm the Deep Research Agent. Ask me a complex question, and I will search the web, compare sources, and synthesize a cited answer for you.
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <form id="chat-form">
                    <input type="text" id="query-input" placeholder="Ask anything... (e.g. Compare LPU and GPU architectures)" required autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Template for Trace Inspector -->
    <template id="trace-inspector-template">
        <div class="trace-inspector glass">
            <details>
                <summary>Research Progress</summary>
                <div class="trace-content">
                    <ul class="trace-timeline">
                        <!-- Steps injected here -->
                    </ul>
                    <div class="trace-stats">
                        <div class="stat"><span class="stat-label">Prompt Tokens</span> <span class="pt">0</span></div>
                        <div class="stat"><span class="stat-label">Completion Tokens</span> <span class="ct">0</span></div>
                    </div>
                    <div class="sources-grid">
                        <!-- Source cards injected here -->
                    </div>
                </div>
            </details>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
